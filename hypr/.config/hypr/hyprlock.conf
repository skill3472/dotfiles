background {
    monitor =
    path = /home/skill/wallpaper.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(0, 0, 0, 255)
    inner_color = rgb(34, 34, 34)
    font_color = rgb(69, 133, 136)
    fade_on_empty = true
    font_family = SF Mono
    placeholder_text = <i><span font='SF Mono Regular' foreground="##B36185">Enter Pass</span></i>
    hide_input = false
    position = 0, -310
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##EEEEEE'>$(date '+%H:%M')</span>"
    color = rgba(216, 222, 233, 0.50)
    font_size = 140
    font_family = SF Mono
    position = 0, 380zl
    halign = center
    valign = center
}


# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##7E9557'>$(date '+%A, %d %b')</span>"
    color = rgba(250, 250, 250, 0.8)
    font_size = 35
    font_family = SF Mono
    position = 0, 265
    halign = center
    valign = center
}